name: CI/CD

# Replaces the legacy .travis.yml (Linux/macOS test + manylinux1 + macOS
# wheels) and .appveyor.yml (Windows test + wheels) for aiohttp 3.0.8.
#
# Target artifacts (uploaded under `dist/` on every successful run and
# published to PyPI on tag pushes):
#   aiohttp-3.0.8.tar.gz
#   aiohttp-3.0.8-cp35-cp35m-manylinux1_{i686,x86_64}.whl
#   aiohttp-3.0.8-cp36-cp36m-manylinux1_{i686,x86_64}.whl
#   aiohttp-3.0.8-cp35-cp35m-win32.whl
#   aiohttp-3.0.8-cp35-cp35m-win_amd64.whl
#   aiohttp-3.0.8-cp36-cp36m-win32.whl
#   aiohttp-3.0.8-cp36-cp36m-win_amd64.whl
#   aiohttp-3.0.8-cp35-cp35m-macosx_10_{10,11,12}_x86_64.whl
#   aiohttp-3.0.8-cp36-cp36m-macosx_10_{11,12}_x86_64.whl
#
# Caveat: Python 3.5 / 3.6 are EOL. actions/setup-python still publishes
# them, but only on x86_64 runner images (ubuntu-*, windows-*, macos-13).
# Apple Silicon runners (macos-14+) cannot host them.

on:
  push:
    branches: [master]
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Seal time-machine PyPI index — pins transitive deps to 2018-03-13,
  # matching the aiohttp 3.0.8 release era. Mirrors the Makefile.
  PIP_INDEX_URL: https://:2018-03-13T09:30:47.597421Z@time-machines-pypi.sealsecurity.io/

jobs:
  # ---------------------------------------------------------------------------
  # Linux tests. Python 3.5/3.6 were dropped from actions/setup-python on
  # ubuntu-22.04 and ubuntu-20.04 is retired, so the tests run inside the
  # official python:3.5 / python:3.6 Docker images. Those base on Debian
  # Stretch (glibc 2.24), which can't run Node 20 — hence checkout@v3
  # (Node 16) is pinned.
  # ---------------------------------------------------------------------------
  test-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.5', '3.6']
    container:
      image: python:${{ matrix.python-version }}
    env:
      # tests/sample.key is too short for OpenSSL's default security level,
      # so test_worker.py SSL tests die with EE_KEY_TOO_SMALL. Point OpenSSL
      # at a permissive config that drops SECLEVEL to 0.
      OPENSSL_CONF: /tmp/openssl-permissive.cnf
    steps:
      - uses: actions/checkout@v3
      - name: Write permissive openssl.cnf
        run: |
          cat > /tmp/openssl-permissive.cnf <<'EOF'
          openssl_conf = openssl_init

          [openssl_init]
          ssl_conf = ssl_sect

          [ssl_sect]
          system_default = system_default_sect

          [system_default_sect]
          CipherString = DEFAULT:@SECLEVEL=0
          EOF
      - run: python -m pip install -U pip wheel
      # Pin setuptools<46 — the python:3.5/3.6 image ships setuptools 50+,
      # but towncrier 17.8.0 (via ci-wheel.txt) pulls in old Jinja2 → ancient
      # MarkupSafe 1.0 sdist, whose setup.py does `from setuptools import
      # Feature`. `Feature` was removed in setuptools 46. 45.x is the last
      # series with it and the last to support Python 3.5.
      - run: python -m pip install 'setuptools<46'
      # Pre-install Cython into the env so setup.py can pick it up.
      - run: python -m pip install cython==0.27.3
      # Skip requirements/ci.txt's `-r doc.txt` chain (extra Sphinx weight);
      # tests don't need Sphinx. ci-wheel.txt pins pip==9.0.1, which uses
      # legacy setup.py builds (no PEP 517 isolation), so the parent env's
      # Cython is visible directly to setup.py — no --no-build-isolation
      # needed.
      - run: python -m pip install -r requirements/ci-wheel.txt setuptools-git==1.2
      - run: python -m pip install -e .
      - name: pytest (pure Python)
        env:
          AIOHTTP_NO_EXTENSIONS: '1'
        run: pytest tests
      - name: pytest (asyncio debug)
        env:
          PYTHONASYNCIODEBUG: '1'
        run: pytest tests
      - name: pytest (with C extensions)
        run: pytest tests

  # ---------------------------------------------------------------------------
  # Windows tests (AppVeyor: matrix of Python35/35-x64/36/36-x64)
  # ---------------------------------------------------------------------------
  test-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.5', '3.6']
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -U pip wheel setuptools
      - run: python -m pip install -r requirements/ci.txt
      # pytest-timeout: each test gets killed after 60s so a single stuck
      # test (test_client_functional.py has a few that hang on Windows under
      # --aiohttp-loop=all) doesn't burn the whole job's runtime.
      - run: python -m pip install pytest-timeout
      - run: python -m pytest tests --timeout=60

  # ---------------------------------------------------------------------------
  # Source distribution (Travis: deploy step, distribution: sdist)
  # Produces: aiohttp-3.0.8.tar.gz
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Sdist generation doesn't depend on the build interpreter version;
          # any modern Python that satisfies setup.py's >=3.5.3 check works.
          python-version: '3.11'
      - run: python -m pip install -U pip wheel setuptools
      # Pull Cython from real PyPI: the time-machine index only has Cython
      # 0.27.3 as an sdist, which won't build on Python 3.11.
      - name: Install Cython (real PyPI)
        env:
          PIP_INDEX_URL: https://pypi.org/simple/
        run: python -m pip install -U cython
      - run: python setup.py sdist --formats=gztar
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # manylinux1 wheels via the existing Docker scripts (Travis: run_docker.sh).
  # Produces 4 wheels: cp35/cp36 × i686/x86_64.
  # ---------------------------------------------------------------------------
  build-manylinux1:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    steps:
      - uses: actions/checkout@v4
      - name: Enable multi-arch userspace (for i686)
        if: matrix.arch == 'i686'
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Build manylinux1 wheels (${{ matrix.arch }})
        run: |
          mkdir -p dist
          pre=""
          if [ "${{ matrix.arch }}" = "i686" ]; then pre="linux32"; fi
          docker run --rm -v "$PWD":/io \
            "quay.io/pypa/manylinux1_${{ matrix.arch }}" \
            $pre /io/tools/build-wheels.sh aiohttp
      - uses: actions/upload-artifact@v4
        with:
          name: manylinux1-${{ matrix.arch }}
          path: dist/*-manylinux1_${{ matrix.arch }}.whl
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows wheels (AppVeyor: after_test `setup.py sdist bdist_wheel`).
  # Produces 4 wheels: cp35/cp36 × win32/win_amd64.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.5'
            architecture: x86
            plat-tag: win32
            msvc-arch: x86
          - python-version: '3.5'
            architecture: x64
            plat-tag: win_amd64
            msvc-arch: amd64
          - python-version: '3.6'
            architecture: x86
            plat-tag: win32
            msvc-arch: x86
          - python-version: '3.6'
            architecture: x64
            plat-tag: win_amd64
            msvc-arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      # Python 3.5's distutils.msvccompiler can't locate the v14.x toolchain
      # on windows-2022 (which only ships VS 2022), and setup.py's
      # ve_build_ext swallows the resulting DistutilsPlatformError and
      # silently falls back to a pure-Python wheel. ilammy/msvc-dev-cmd sets
      # up INCLUDE/LIB/PATH for the requested arch, and DISTUTILS_USE_SDK
      # tells distutils to skip its own broken compiler lookup and trust
      # those vars instead. 3.6 worked accidentally before — this just makes
      # it deterministic.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - run: python -m pip install -U pip wheel setuptools
      - run: python -m pip install -r requirements/wheel.txt
      - name: Build wheel
        env:
          DISTUTILS_USE_SDK: '1'
          MSSdk: '1'
        run: python setup.py bdist_wheel
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cp${{ matrix.python-version }}-${{ matrix.plat-tag }}
          path: dist/*-${{ matrix.plat-tag }}.whl
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS wheels (Travis: osx_pypi_deploy_base_10{10,11,12}).
  # Platform tag is driven by MACOSX_DEPLOYMENT_TARGET, not the runner OS,
  # so a single macos-13 (Intel) image produces all 5 wheels.
  # macos-14+ (Apple Silicon) can't host Python 3.5/3.6.
  # Produces: cp35 × {10.10, 10.11, 10.12} + cp36 × {10.11, 10.12} = 5 wheels.
  # ---------------------------------------------------------------------------
  # build-macos:
  #   runs-on: macos-13
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       include:
  #         - python-version: '3.5'
  #           macosx-target: '10.10'
  #           plat-tag: '10_10'
  #         - python-version: '3.5'
  #           macosx-target: '10.11'
  #           plat-tag: '10_11'
  #         - python-version: '3.5'
  #           macosx-target: '10.12'
  #           plat-tag: '10_12'
  #         - python-version: '3.6'
  #           macosx-target: '10.11'
  #           plat-tag: '10_11'
  #         - python-version: '3.6'
  #           macosx-target: '10.12'
  #           plat-tag: '10_12'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ matrix.python-version }}
  #     - run: python -m pip install -U pip wheel setuptools
  #     - run: python -m pip install -r requirements/wheel.txt
  #     - name: Build wheel (MACOSX_DEPLOYMENT_TARGET=${{ matrix.macosx-target }})
  #       env:
  #         MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-target }}
  #       run: python setup.py bdist_wheel
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: macos-cp${{ matrix.python-version }}-${{ matrix.plat-tag }}
  #         path: dist/*-macosx_${{ matrix.plat-tag }}_x86_64.whl
  #         if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Collect every wheel + sdist produced by the build jobs into a single
  # workflow-run artifact named `aiohttp-3.0.8-dist`, so the whole set is
  # downloadable from the Actions run page in one click.
  # ---------------------------------------------------------------------------
  collect:
    if: always()
    needs:
      - build-sdist
      - build-manylinux1
      - build-windows
      # - build-macos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: aiohttp-3.0.8-dist
          path: dist/*
          if-no-files-found: warn
